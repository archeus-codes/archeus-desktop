name: Release

# Pushing a tag such as v1.0.0 builds every installer and attaches them to a draft GitHub Release, to check and publish.
# Set the POM to that version and push the commit first. Only plain versions match, since jpackage drops a suffix such
# as -rc1 from the installers' names.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

jobs:
  # The tag must name the POM's version, so the installers carry the version the release says.
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25.0.5'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check the tag against the POM's version
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the POM's version is $version"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Both Mac builds come out as Archeus-<version>.dmg, so each installer is named for its system and processor.
      - name: Name the installers
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir release
          mv "artifacts/archeus-macos-latest/Archeus-$version.dmg" "release/Archeus-$version-macos-arm64.dmg"
          mv "artifacts/archeus-macos-15-intel/Archeus-$version.dmg" "release/Archeus-$version-macos-x64.dmg"
          mv "artifacts/archeus-windows-latest/Archeus-$version.msi" "release/Archeus-$version-windows-x64.msi"
          mv "artifacts/archeus-ubuntu-24.04/archeus_${version}_amd64.deb" release/
          ls -l release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "Archeus ${GITHUB_REF_NAME#v}"
          --generate-notes
