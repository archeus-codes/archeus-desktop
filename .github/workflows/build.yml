name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Each OS builds its own installer, so one failing doesn't cancel the others.
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel builds the Intel app. Linux builds on 24.04, not the newest
        # Ubuntu, so the deb installs on 24.04 and later.
        os: [ macos-latest, macos-15-intel, windows-latest, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The tests start JavaFX, which needs a display; Linux runners have none. jpackage builds the deb with fakeroot.
      - name: Install a virtual display for JavaFX, and fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1 fakeroot

      # jpackage builds the msi with the WiX Toolset. The Windows image comes with WiX 3.14, whose installer sets WIX to
      # its folder, so it's installed only when missing.
      - name: Set up WiX
        if: runner.os == 'Windows'
        run: |
          $bin = if ($env:WIX) { Join-Path $env:WIX 'bin' } else { "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" }
          if (-not (Test-Path "$bin\candle.exe")) {
            choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # verify runs the tests and fails below 85% line coverage, then jpackage builds the app and its installer.
      - name: Build the app and its installer
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}./mvnw -B clean verify "-Pjpackage,installer"

      # The installer, rather than the app folder: an artifact loses the files' executable bits.
      - uses: actions/upload-artifact@v7
        with:
          name: archeus-${{ matrix.os }}
          path: target/installer/
          if-no-files-found: error
